<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Regex Deck icon</title>
<style>
  html, body { margin: 0; padding: 0; width: 128px; height: 128px; overflow: hidden; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3528" />
      <stop offset="1" stop-color="#0d1a13" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#477a5b" />
      <stop offset="1" stop-color="#1f3a2b" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#bg)" />
  <rect x="4" y="4" width="120" height="120" rx="27" fill="none" stroke="url(#edge)" stroke-width="2" />

  <text x="25" y="78" text-anchor="middle" fill="#6b9379"
        font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace"
        font-size="40" font-weight="700">/</text>
  <text x="103" y="78" text-anchor="middle" fill="#6b9379"
        font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace"
        font-size="40" font-weight="700">/</text>

  <circle cx="49" cy="73" r="6.5" fill="#9df0ba" />
  <text x="78" y="82" text-anchor="middle" fill="#9df0ba"
        font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace"
        font-size="60" font-weight="700">*</text>

  <circle cx="46" cy="101" r="5" fill="#6fb3ff" />
  <circle cx="64" cy="101" r="5" fill="#ff7aa8" />
  <circle cx="82" cy="101" r="5" fill="#8fdc8f" />
</svg>
</body>
</html>
